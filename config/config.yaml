# One row per sample: sample_id, r1, r2, then any study metadata columns.
samples: config/samples.tsv

# Where results are written. The Capsomer bundle is in <output>/bundle.
output: results

# megahit or metaspades. Each sample is assembled on its own.
assembler: megahit
min_contig_length: 1000

databases:
  genomad: databases/genomad_db
  checkv: databases/checkv-db-v1.5

# Viral contigs are everything geNomad calls viral, plus contigs only Jaeger calls viral.
# Jaeger is in its own environment (workflow/envs/jaeger.yaml). Download a model once with:
#   jaeger download --path databases/jaeger --model_name jaeger_448931d3_1.3M_fragment
jaeger:
  enabled: true
  command: jaeger
  model: jaeger_448931d3_1.3M_fragment
  # Shortest contig accepted on Jaeger's call alone. 0 accepts any length, which suits
  # particle-enriched viromes. For samples with much bacterial DNA, 5000 avoids most of
  # Jaeger's false calls on short contigs.
  min_length: 0

# Species-level clusters of viral contigs, pooled over all samples.
clustering:
  algorithm: leiden
  min_ani: 0.95
  min_coverage: 0.85

threads:
  default: 8
  # MEGAHIT 1.2.9 crashes with more than one thread on Apple Silicon. Set megahit: 1 there.

bundle:
  id: my-study
  title: My virome study
